<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Report</title>
</head>
<body>
  <h1>Sunshine High School</h1>

  <table border="1" cellpadding="6" cellspacing="0">
    <caption title="Student marks report">Marks Report for Student</caption>
    <thead>
      <tr>
        <th>Subject</th>
        <th title="Maximum marks for each subject">Max Marks</th>
        <th title="Marks obtained by student">Obtained Marks</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Mathematics</td>
        <td>100</td>
        <td>85</td>
      </tr>
      <tr>
        <td>Science</td>
        <td>100</td>
        <td>90</td>
      </tr>
      <tr>
        <td>English</td>
        <td>100</td>
        <td>88</td>
      </tr>
      <tr>
        <td>History</td>
        <td>100</td>
        <td>82</td>
      </tr>
      <tr>
        <td>Computer</td>
        <td>100</td>
        <td>95</td>
      </tr>
      <tr>
        <td colspan="2" style="text-align:right;">Total</td>
        <td>440</td>
      </tr>
      <tr>
        <td colspan="2" style="text-align:right;">Percentage</td>
        <td>88%</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
