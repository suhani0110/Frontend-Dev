<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations Example</title>
</head>
<body>
    <h2>Quotations Demo</h2>

    <!-- Long Quote -->
    <blockquote>
        "The greatest glory in living lies not in never falling, but in rising every time we fall." 
        &mdash; Nelson Mandela
    </blockquote>

    <!-- Paragraph with Short Quote -->
    <p>
        As Albert Einstein once said, <q>Life is like riding a bicycle. To keep your balance, you must keep moving.</q> 
        Notice how the &amp; symbol is included here as an HTML entity.
    </p>
</body>
</html>
