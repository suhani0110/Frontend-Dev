<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Before & After – Filter Comparison</h1>

  <div class="comparison-container">

    <!-- Before Image -->
    <figure class="image-box">
      <img src="/mnt/data/e5a6cca4-921e-43e8-889f-8c07567ecc46.png" alt="before">
      <figcaption>Before (Original)</figcaption>
    </figure>

    <!-- After Image -->
    <figure class="image-box">
      <img class="filtered" src="/mnt/data/e5a6cca4-921e-43e8-889f-8c07567ecc46.png" alt="after filtered">
      <figcaption>After (Brightness + Contrast)</figcaption>
    </figure>

  </div>

</body>
</html>
