<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSS Photo Gallery</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header class="page-header">
    <h1>Photo Gallery</h1>
    <p>Pure CSS gallery — responsive, modern, and accessible.</p>
  </header>

  <main class="gallery" aria-label="Photo gallery">
    <!-- Repeat similar blocks for each photo (6+ images) -->
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
           alt="Ocean cliff at sunrise">
      <figcaption class="caption">Ocean cliff at sunrise</figcaption>
    </figure>

    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
           alt="Street cafe in the evening">
      <figcaption class="caption">Street cafe in the evening</figcaption>
    </figure>

    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=80"
           alt="Mountain lake reflection">
      <figcaption class="caption">Mountain lake reflection</figcaption>
    </figure>

    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=1200&q=80"
           alt="Colorful market stalls">
      <figcaption class="caption">Colorful market stalls</figcaption>
    </figure>

    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80"
           alt="Forest path with sunlight">
      <figcaption class="caption">Forest path with sunlight</figcaption>
    </figure>

    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1200&q=80"
           alt="City skyline at dusk">
      <figcaption class="caption">City skyline at dusk</figcaption>
    </figure>

    <!-- Extra images to show wrapping/responsiveness -->
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
           alt="Sunset over the sea">
      <figcaption class="caption">Sunset over the sea</figcaption>
    </figure>

    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80"
           alt="Desert dunes">
      <figcaption class="caption">Desert dunes</figcaption>
    </figure>
  </main>

  <footer class="page-footer">
    <p>© 2025 — Photo Gallery Demo</p>
  </footer>
</body>
</html>
