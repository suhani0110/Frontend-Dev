<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>
  <main class="page">
    <div class="center-wrapper">
      <form class="contact-form" action="#" method="post" novalidate>
        <h1>Contact Us</h1>
        <p class="subtitle">We'd love to hear from you — send us a message and we'll get back soon.</p>

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required placeholder="Your full name" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" />

        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" required placeholder="Subject of your message" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required placeholder="Write your message here..."></textarea>

        <div class="actions">
          <button type="submit" class="btn">Send Message</button>
          <button type="reset" class="btn secondary">Reset</button>
        </div>

        <p class="note">By sending, you agree to our <a href="#" class="link">privacy policy</a>.</p>
      </form>
    </div>
  </main>
</body>
</html>
